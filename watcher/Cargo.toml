[package]
name = "printust_watcher"
version = "0.1.0"
edition = "2021"

[dependencies]
printust_core = { path = "../core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
quick-xml = "0.37"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_Threading",
] }
